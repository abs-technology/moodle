name: ci

on:
  pull_request:
  push:
    branches: [main, moodle-core-5-3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build manifest
        run: ./scripts/verify-build-manifest.sh
      - name: Script syntax
        run: |
          bash -n scripts/verify-build-manifest.sh
          bash -n scripts/smoke-image.sh
          bash -n scripts/lib/config.sh
          bash -n scripts/utils/docker-scout.sh

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build native image
        run: |
          set -euo pipefail
          eval "$(awk -F ' := ' '/^[A-Z0-9_]+ := /{printf "export %s=\"%s\"\n",$1,$2}' versions.lock)"
          docker build \
            --build-arg MOODLE_VERSION="$MOODLE_VERSION" \
            --build-arg MOODLE_RELEASE_PREFIX="$MOODLE_RELEASE_PREFIX" \
            --build-arg MOODLE_DOWNLOAD_URL="$MOODLE_DOWNLOAD_URL" \
            --build-arg MOODLE_TGZ_SHA256="$MOODLE_TGZ_SHA256" \
            --build-arg PHP_VERSION="$PHP_VERSION" \
            --build-arg PHP_RELEASE="$PHP_RELEASE" \
            --build-arg COMPOSER_VERSION="$COMPOSER_VERSION" \
            --build-arg COMPOSER_SHA256="$COMPOSER_SHA256" \
            --build-arg SURY_PHP_GPG_SHA256="$SURY_PHP_GPG_SHA256" \
            --build-arg BASE_IMAGE="${BASE_IMAGE}@${BASE_IMAGE_DIGEST}" \
            --build-arg MARIADB_IMAGE="${MARIADB_IMAGE}@${MARIADB_IMAGE_DIGEST}" \
            -t "abstechnology/moodle-standard:${DOCKER_TAG}" .
      - name: Smoke
        run: ./scripts/smoke-image.sh
