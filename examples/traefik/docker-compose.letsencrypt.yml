# Let's Encrypt override for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.letsencrypt.yml up -d
#
# Requires ACME_EMAIL in .env and a MOODLE_DOMAIN that resolves publicly to this
# host, because the HTTP-01 challenge is served on port 80.
services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --log.level=INFO
      - --accesslog=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Uncomment while testing to avoid burning the production rate limit.
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme

  moodle:
    labels:
      - traefik.http.routers.moodle.tls.certresolver=le

volumes:
  traefik_acme:
