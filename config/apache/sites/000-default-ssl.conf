<VirtualHost *:8443>
    ServerAdmin admin@absi-tech.com
    DocumentRoot /var/www/html

    # ================= SSL =================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/localhost.crt
    SSLCertificateKeyFile /etc/ssl/private/localhost.key

    # ================= Proxy =================
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 130.211.0.0/22
    RemoteIPTrustedProxy 35.191.0.0/16

    # ================= Security headers =================
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-Content-Type-Options nosniff
        Header always unset X-Powered-By
    </IfModule>

    # ================= HARD BLOCK FILES =================

    # composer
    <FilesMatch "(^composer\.json$|^composer\.lock$)">
        Require all denied
    </FilesMatch>

    # phpunit
    <FilesMatch "^phpunit\.xml">
        Require all denied
    </FilesMatch>

    # install.xml
    <FilesMatch "install\.xml$">
        Require all denied
    </FilesMatch>

    # Block documentation files only (not functional PHP scripts)
    <FilesMatch "(?i)^(readme|upgrading)\.(txt|md)$">
        Require all denied
    </FilesMatch>

    # environment.xml
    <Files "environment.xml">
        Require all denied
    </Files>

    # ================= HARD BLOCK DIRECTORIES =================

    <DirectoryMatch "/var/www/html/vendor">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/node_modules">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*\.git">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/lib/classes">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*/tests/behat">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*/fixtures">
        Require all denied
    </DirectoryMatch>

    # ===== convert 403 -> 404 stealth =====
    ErrorDocument 403 /404.html
    ErrorDocument 404 /404.html

    # ================= MAIN DIRECTORY =================
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        RewriteEngine On
        RewriteBase /

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # ================= moodledata protect =================
    <Directory /var/www/moodledata>
        Require all denied
    </Directory>

    # ================= logs =================
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined_lb
</VirtualHost>