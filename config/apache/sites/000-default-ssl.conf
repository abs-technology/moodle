# Apache listens on both 8443 (docker-mapped from host:443) and 443 (loopback
# only, for Moodle router self-check). One VirtualHost serves both, identical
# config — see apache2.conf for the listen rationale.
<VirtualHost *:8443 *:443>
    ServerAdmin admin@absi-tech.com
    # Moodle 5.x: web root is the `public/` subdirectory (see apache2.conf).
    DocumentRoot /var/www/html/public

    # ================= SSL =================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/localhost.crt
    SSLCertificateKeyFile /etc/ssl/private/localhost.key

    # ================= Proxy =================
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 130.211.0.0/22
    RemoteIPTrustedProxy 35.191.0.0/16

    # ================= Security headers =================
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-Content-Type-Options nosniff
        Header always unset X-Powered-By
    </IfModule>

    # ================= HARD BLOCK FILES =================

    # composer
    <FilesMatch "(^composer\.json$|^composer\.lock$)">
        Require all denied
    </FilesMatch>

    # phpunit
    <FilesMatch "^phpunit\.xml">
        Require all denied
    </FilesMatch>

    # install.xml
    <FilesMatch "install\.xml$">
        Require all denied
    </FilesMatch>

    # Block documentation files only (not functional PHP scripts)
    <FilesMatch "(?i)^(readme|upgrading)\.(txt|md)$">
        Require all denied
    </FilesMatch>

    # environment.xml
    <Files "environment.xml">
        Require all denied
    </Files>

    # ================= HARD BLOCK DIRECTORIES =================
    # See 000-default.conf for full layout notes.
    <DirectoryMatch "/var/www/html/vendor">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/node_modules">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*\.git">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/lib/classes">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/.*/tests/behat">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/.*/fixtures">
        Require all denied
    </DirectoryMatch>

    # ===== convert 403 -> 404 stealth =====
    ErrorDocument 403 /404.html
    ErrorDocument 404 /404.html

    # ================= MAIN DIRECTORY =================
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        # Moodle 5.1+ Router (see 000-default.conf for explanation).
        FallbackResource /r.php

        RewriteEngine On
        RewriteBase /

        # Send .php requests to PHP-FPM ONLY when the file actually exists on
        # disk. See 000-default.conf for the full rationale (Moodle router
        # nofile-shim check requires FallbackResource /r.php to handle
        # non-existent .php paths instead of forwarding them to PHP-FPM).
        <FilesMatch \.php$>
            <If "-f %{REQUEST_FILENAME}">
                SetHandler "proxy:unix:/var/run/php/php8.4-fpm.sock|fcgi://localhost"
            </If>
        </FilesMatch>
    </Directory>

    # ================= moodledata protect =================
    <Directory /var/www/moodledata>
        Require all denied
    </Directory>

    # ================= logs =================
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined_lb
</VirtualHost>