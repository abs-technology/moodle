# Apache listens on both 8080 (docker-mapped from host:80) and 80 (loopback
# only, for Moodle router self-check). One VirtualHost serves both, identical
# config — see apache2.conf for the listen rationale.
<VirtualHost *:8080 *:80>
    ServerAdmin webmaster@localhost
    # Moodle 5.x: web root is the `public/` subdirectory (see apache2.conf).
    DocumentRoot /var/www/html/public

    # ================= Proxy =================
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 130.211.0.0/22
    RemoteIPTrustedProxy 35.191.0.0/16

    # ================= Security headers =================
    <IfModule mod_headers.c>
        SetEnvIf X-Forwarded-Proto "https" HTTPS=on
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always unset X-Powered-By
    </IfModule>

    # ================= HARD BLOCK FILES =================

    # composer + lock
    <FilesMatch "(^composer\.json$|^composer\.lock$)">
        Require all denied
    </FilesMatch>

    # phpunit
    <FilesMatch "^phpunit\.xml">
        Require all denied
    </FilesMatch>

    # install.xml
    <FilesMatch "install\.xml$">
        Require all denied
    </FilesMatch>

    # Block documentation files only (not functional PHP scripts)
    <FilesMatch "(?i)^(readme|upgrading)\.(txt|md)$">
        Require all denied
    </FilesMatch>

    # environment.xml
    <Files "environment.xml">
        Require all denied
    </Files>

    # ===== HARD BLOCK DIRECTORIES =====
    #
    # Moodle 5.x layout (see https://moodledev.io/docs/5.1/guides/restructure):
    #   /var/www/html/                 <- moodle root (NOT served)
    #     vendor/                      <- composer deps, MUST be denied
    #     node_modules/                <- node deps, MUST be denied
    #     admin/cli/                   <- CLI scripts only, NOT served
    #     config.php, version.php, composer.* <- root-only configs
    #     public/                      <- DocumentRoot, web-accessible
    #       lib/classes/               <- internal PHP classes
    #       <plugin>/tests/behat/      <- behat fixtures
    #       <plugin>/.../fixtures/     <- test fixtures
    #
    # We still emit deny-rules under /var/www/html/... for vendor & node_modules
    # as defence-in-depth in case a future config change ever exposes the root.
    <DirectoryMatch "/var/www/html/vendor">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/node_modules">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*\.git">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/lib/classes">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/.*/tests/behat">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/public/.*/fixtures">
        Require all denied
    </DirectoryMatch>

    # convert 403 -> 404 stealth
    ErrorDocument 403 /404.html
    ErrorDocument 404 /404.html

    # ================= Directory =================
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        # Moodle 5.1+ Router: any path that does not match a real file/dir
        # is dispatched through public/r.php. Required for the new clean URLs.
        # See https://docs.moodle.org/500/en/Configuring_the_Router
        FallbackResource /r.php

        RewriteEngine On
        RewriteCond %{HTTP:X-Forwarded-Proto} =https
        RewriteRule ^(.*)$ - [E=HTTPS:on]

        # Send .php requests to PHP-FPM ONLY when the file actually exists on
        # disk. For URLs like /lib/exampleshimroute2.php (no file present)
        # this leaves the handler unset, so Apache falls through to
        # `FallbackResource /r.php` above and the Moodle router can serve a
        # 302 redirect (otherwise PHP-FPM responds "Primary script unknown"
        # → 404, which breaks the routerfailroutershim environment check).
        <FilesMatch \.php$>
            <If "-f %{REQUEST_FILENAME}">
                SetHandler "proxy:unix:/var/run/php/php8.4-fpm.sock|fcgi://localhost"
            </If>
        </FilesMatch>
    </Directory>

    # ================= Logs =================
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>