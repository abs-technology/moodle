<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # ================= Proxy =================
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 130.211.0.0/22
    RemoteIPTrustedProxy 35.191.0.0/16

    # ================= Security headers =================
    <IfModule mod_headers.c>
        SetEnvIf X-Forwarded-Proto "https" HTTPS=on
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always unset X-Powered-By
    </IfModule>

    # ================= HARD BLOCK FILES =================

    # composer + lock
    <FilesMatch "(^composer\.json$|^composer\.lock$)">
        Require all denied
    </FilesMatch>

    # phpunit
    <FilesMatch "^phpunit\.xml">
        Require all denied
    </FilesMatch>

    # install.xml
    <FilesMatch "install\.xml$">
        Require all denied
    </FilesMatch>

    # Block documentation files only (not functional PHP scripts)
    <FilesMatch "(?i)^(readme|upgrading)\.(txt|md)$">
        Require all denied
    </FilesMatch>

    # environment.xml
    <Files "environment.xml">
        Require all denied
    </Files>

    # ===== HARD BLOCK DIRECTORIES =====

    <DirectoryMatch "/var/www/html/vendor">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/node_modules">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*\.git">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/lib/classes">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*/tests/behat">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/var/www/html/.*/fixtures">
        Require all denied
    </DirectoryMatch>

    # convert 403 -> 404 stealth
    ErrorDocument 403 /404.html
    ErrorDocument 404 /404.html

    # ================= Directory =================
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html

        RewriteEngine On
        RewriteCond %{HTTP:X-Forwarded-Proto} =https
        RewriteRule ^(.*)$ - [E=HTTPS:on]

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # ================= Logs =================
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>