# Apache HTTP Server Configuration for Absi Technology Moodle
# This file is copied into /etc/apache2/apache2.conf inside the Docker container.

# Global configuration
ServerRoot "/etc/apache2"
ServerName localhost

# Security settings
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Basic configuration
PidFile /var/run/apache2/apache2.pid

# Listen on the docker-mapped non-privileged ports (host:80 -> container:8080,
# host:443 -> container:8443). These handle all external traffic.
Listen 8080
Listen 8443

# ALSO listen on the standard 80/443 inside the container so loopback HTTP
# requests (https://localhost) work without specifying a port. Required by
# Moodle 5.1+ router self-check, which calls $CFG->wwwroot from PHP on the
# server itself. Apache binds these via cap_net_bind_service granted to
# /usr/sbin/apache2 in the Dockerfile (Apache runs as non-root absiuser).
# These ports are NOT exposed/published by docker; only loopback uses them.
Listen 80
Listen 443

# Load balancer optimizations
UseCanonicalName Off
UseCanonicalPhysicalPort Off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 15

# Worker configuration
User absiuser
Group absiuser

# Global logging configuration
ErrorLog /dev/stderr
LogLevel warn

# Define log format
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent

# Load balancer log format with X-Forwarded headers
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" \"%{X-Forwarded-Proto}i\"" combined_lb

# Access log configuration
CustomLog /dev/stdout combined_lb

# Other vhosts access log
Include /etc/apache2/conf-available/other-vhosts-access-log.conf

# Document root.
# Moodle 5.x restructured the codebase: most web-accessible files moved into
# the `public/` subdirectory. Sensitive files (config.php, vendor/,
# node_modules/, admin/cli/, version.php, composer.*) STAY at the root.
# So DocumentRoot must point to <moodle>/public, not the moodle root.
# See https://moodledev.io/docs/5.1/guides/restructure
DocumentRoot "/var/www/html/public"
<Directory "/var/www/html/public">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# PHP-FPM configuration: forward .php requests to PHP-FPM ONLY when the file
# exists on disk. Non-existent .php paths must fall through to the per-vhost
# `FallbackResource /r.php` so Moodle's router (5.1+) can handle them — see
# the matching block in sites/000-default*.conf for the full rationale.
<FilesMatch \.php$>
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:unix:/var/run/php/php8.4-fpm.sock|fcgi://localhost"
    </If>
</FilesMatch>

# Include additional configuration files
IncludeOptional /etc/apache2/conf-enabled/*.conf
IncludeOptional /etc/apache2/sites-enabled/*.conf

# Access control
<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

# Directory for Apache modules.
# Ensure 'a2enmod' is used in Dockerfile to link these.
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

# Include site-specific configuration files.
# The 000-default.conf will be linked here by 'a2ensite' in Dockerfile.
IncludeOptional sites-enabled/*.conf

# HTTPoxy Fix (important security measure)
<IfModule mod_headers.c>
    RequestHeader unset Proxy
</IfModule>

# Server Tokens (for security, hide Apache version)
ServerTokens Prod

# Mutex configuration
Mutex file:/var/lock/apache2 default

# DefaultType
DefaultType None

# MPM configuration optimized for load balancing
<IfModule mpm_prefork_module>
    StartServers          8
    MinSpareServers       8
    MaxSpareServers      20
    MaxRequestWorkers    256
    MaxConnectionsPerChild 1000
    ServerLimit          256
</IfModule>

# Listening configuration handled at top of file (8080 + 8443 for docker port
# mapping, plus 80 + 443 for in-container loopback / Moodle router self-check).

# Other general configurations if needed
# Supplemental configuration (optional)
# Include some-other-custom-config.conf
