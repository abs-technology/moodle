# ModSecurity Configuration for ABSI Moodle
# SafeMode: DetectionOnly - Only logs threats, does not block
# This ensures production stability while collecting security intelligence

<IfModule security2_module>
    # Basic configuration
    SecRuleEngine DetectionOnly
    SecRequestBodyAccess On
    SecResponseBodyAccess Off
    
    # Maximum request body size (2GB to match Moodle upload limits)
    SecRequestBodyLimit 2147483648
    SecRequestBodyNoFilesLimit 131072
    
    # Reject if larger than configured limit
    SecRequestBodyLimitAction Reject
    
    # Debug log level (adjust as needed: 0=no logging, 9=very detailed)
    SecDebugLog /var/log/apache2/modsec_debug.log
    SecDebugLogLevel 0
    
    # Audit log configuration
    SecAuditEngine RelevantOnly
    SecAuditLogRelevantStatus "^(?:5|4(?!04))"
    SecAuditLogParts ABIJDEFHZ
    SecAuditLogType Serial
    SecAuditLog /var/log/apache2/modsec_audit.log
    
    # Handle file uploads
    SecTmpDir /tmp
    SecDataDir /tmp
    
    # Unicode and UTF-8 support for international content
    SecUnicodeMapFile unicode.map 20127
    
    # Default action when rules match
    SecDefaultAction "phase:1,log,auditlog,pass"
</IfModule>

# Load OWASP Core Rule Set (CRS)
<IfModule security2_module>
    # Include base configuration
    IncludeOptional /etc/modsecurity/*.conf
    
    # Include OWASP CRS rules
    IncludeOptional /usr/share/modsecurity-crs/owasp-crs.load
    IncludeOptional /usr/share/modsecurity-crs/rules/*.conf
</IfModule>

