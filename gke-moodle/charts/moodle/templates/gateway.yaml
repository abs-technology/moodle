{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- if .Values.gateway.certMap }}
  annotations:
    networking.gke.io/certmap: {{ .Values.gateway.certMap | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  {{- if .Values.gateway.namedAddress }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.gateway.namedAddress | quote }}
  {{- end }}
  listeners:
    {{- if .Values.gateway.httpRedirect }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
    # No tls.mode=Terminate here: Gateway API CEL requires certificateRefs or
    # options, and GKE forbids mixing those with networking.gke.io/certmap.
    # Certificate Manager owns TLS via the Gateway annotation (Google docs).
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
