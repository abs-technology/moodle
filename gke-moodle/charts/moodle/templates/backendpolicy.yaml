{{- if and .Values.gateway.enabled .Values.backendPolicy.enabled }}
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "moodle.fullname" . }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
spec:
  default:
    timeoutSec: {{ .Values.backendPolicy.timeoutSec }}
    logging:
      enabled: true
      sampleRate: 1000000
    {{- if .Values.backendPolicy.securityPolicy }}
    securityPolicy: {{ .Values.backendPolicy.securityPolicy | quote }}
    {{- end }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "moodle.fullname" . }}
{{- end }}
